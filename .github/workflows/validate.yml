name: Validate feature branch

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/rental-agreement-review]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
