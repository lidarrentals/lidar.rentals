    <circle cx="120" cy="530" r="8" fill="#00f3ff" filter="url(#laserGlow)"/>
    <circle cx="600" cy="530" r="8" fill="#00f3ff" filter="url(#laserGlow)"/>
    <circle cx="210" cy="460" r="5" fill="#00f3ff" opacity="0.7"/>
